# ============================================================================
#  Заголовки безопасности фронтенда (nginx).
#
#  Файл подключается в КАЖДОМ location, который объявляет свой add_header:
#  nginx наследует add_header с верхнего уровня только если на текущем уровне
#  их нет вовсе, поэтому статика (весь JS-бандл) отдавалась без nosniff и
#  Referrer-Policy (review/REVIEW.md §5.13).
#
#  Намеренно НЕ подключается к location /api/: печатные формы, которые генерирует
#  backend, несут собственную CSP (app/htmlsafe.py) — пересечение двух политик
#  сломало бы их inline-скрипт печати. Backend сам ставит nosniff/X-Frame-Options
#  middleware'ом security_headers (app/main.py).
# ============================================================================

# MIME-sniffing off: отданный с неверным Content-Type .js не исполнится как скрипт
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;

# CSP — основной компенсационный контроль для приложения, работающего с ПДн
# сотрудников и несовершеннолетних. Ключевое: БЕЗ 'unsafe-inline' в script-src,
# поэтому тема вынесена в public/theme.js, а inline-скрипта в index.html нет.
#   style-src 'unsafe-inline' — React пишет стили атрибутами (style={{...}});
#   connect-src ws:/wss:      — канал мгновенных уведомлений /api/v1/realtime/ws;
#   worker-src/child-src blob: — библиотека сканера штрихкодов html5-qrcode;
#   frame-ancestors 'none'     — заменяет устаревший X-Frame-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
