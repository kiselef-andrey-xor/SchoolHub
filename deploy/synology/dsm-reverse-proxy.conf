# ============================================================================
#  DSM → Панель управления → Вход в систему → Дополнительно → Обратный прокси
#  Создайте правило и нажмите «Пользовательская конфигурация» → вставьте это.
#  (Либо заполните поля вручную — они перечислены комментариями ниже.)
# ============================================================================
#
#  Профиль DSM:
#    Описание:        SchoolHub
#    Источник:  HTTPS  schoolhub.school.local   порт 443
#    Назначение: HTTP  localhost                порт 8080   (= HTTP_PORT в .env)
#
#  Ниже — тонкая настройка: большие загрузки, WebSocket-заголовки, таймауты,
#  HSTS и правильный проброс клиентского IP (важно для журнала ознакомления!).

proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;
proxy_set_header   X-Forwarded-Port  $server_port;

# загрузка PDF/DOCX приказов до 30 МБ
client_max_body_size 30m;
proxy_request_buffering off;

# таймауты: конвертация DOCX и выгрузка CSV могут идти дольше минуты
proxy_connect_timeout 60s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# WebSocket мгновенных уведомлений (/api/v1/realtime/ws): без этих строк
# сокет не поднимется и клиент вежливо деградирует до поллинга (45 c)
proxy_http_version 1.1;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        "upgrade";
proxy_read_timeout 3600s;

# HSTS (после проверки, что HTTPS работает стабильно)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
