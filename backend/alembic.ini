# Alembic configuration (v1.3+). Run from the backend/ directory:
#   alembic upgrade head                          -- apply migrations
#   alembic revision --autogenerate -m "message"  -- generate a new revision
# The application migrates itself on startup (AUTO_MIGRATE=true), so on the NAS
# no manual commands are needed.
#
# NOTE: comments in this file are ASCII on purpose. Alembic reads it through
# configparser with encoding="locale", so non-ASCII text raises UnicodeDecodeError
# under a C/POSIX locale -- and because migrations run in the app lifespan, the
# container would fail to start. See review/REVIEW.md 5.2. Russian docs live in
# docs/DEV-GUIDE.md.

[alembic]
script_location = alembic
prepend_sys_path = .
# how to split prepend_sys_path / version_locations: "os" means OS path separator.
# Without it Alembic falls back to legacy space/comma/colon splitting and warns.
path_separator = os
# The database URL comes from the DATABASE_URL environment variable (see
# alembic/env.py); sqlalchemy.url is intentionally not set here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
