# ============================================================================
#  Настройка ruff для backend.
#
#  Файл появился по итогам review/REVIEW.md §5.7: в репозитории не было НИ одного
#  линтера, а CI отсутствовал — поэтому потерянная зависимость (cryptography) и
#  опечатки в именах доехали до main. Здесь намеренно включён только «жёсткий
#  минимум»: правила, нарушение которых означает реальную ошибку (неиспользуемый
#  импорт, неопределённое имя, синтаксис, порядок импортов), а не вопрос вкуса.
#  Стилевые наборы (UP, SIM, B, RUF…) дают сотни замечаний на существующем коде
#  и включаются отдельными задачами, когда будет желание их разгрести.
#
#  Запуск:  cd backend && ruff check .        (или make lint из корня репозитория)
# ============================================================================
target-version = "py311"
line-length = 120
extend-exclude = ["alembic/versions", "storage"]

[lint]
select = [
    "E9",   # синтаксические ошибки и некорректные сравнения
    "F",    # pyflakes: неиспользуемые импорты/переменные, неопределённые имена
    "I",    # isort: воспроизводимый порядок импортов
]
# F401 в __init__.py — это ре-экспорт, а не мусор
ignore = []

[lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"tests/__init__.py" = ["F401"]
